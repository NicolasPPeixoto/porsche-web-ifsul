<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Porsche</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="cadastro_pagina">

        <div class="cadastro_video">
            <video src="static/login.mp4" autoplay muted loop playsinline></video>
        </div>

        <div class="cadastro_card">
            <a href="index.html" class="cadastro_logo">
                <img src="static/menu/porsche-logo.svg" alt="PORSCHE">
            </a>

            <form action="../php/login_ok.php" method="post">
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="email@servidoremail.com" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Sua senha" required>
                </div>

                <div class="botoes">
                    <button type="submit" class="botao_cadastrar">Login</button>
                    <button type="button" class="botao_limpar">Recuperar senha</button>
                </div>
            </form>

            <p class="cadastro_texto">
                Não possui uma conta Porsche?
                <a href="cadastro.html">Registre-se agora</a>
            </p>
        </div>

    </main>
</body>

</html>
